services:
  - type: web
    name: gamefit
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: NODE_VERSION
        value: 22.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: LOAD_FIXTURES_ON_DEPLOY
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gamefit-db
          property: connectionString
      - key: GMS_API_KEY
        sync: false
      - key: IS_THERE_ANY_DEAL_API_KEY
        sync: false
      - key: STEAM_WEB_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false

databases:
  - name: gamefit-db
    plan: free
